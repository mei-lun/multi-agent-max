<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片预处理</title><link rel="stylesheet" href="./style.css"></head>
<body><main><header><p class="eyebrow">CREATIVE / IMAGE</p><h1>图片预处理</h1><p>移除与画布边缘相连的纯色背景，保留封闭区域中的细节。图片仅在本机处理。</p></header>
<section class="tools" aria-label="处理工具"><label class="picker">选择 PNG / JPEG<input id="file" type="file" accept="image/png,image/jpeg"></label><label>颜色容差 <output id="value">24</output><input id="tolerance" type="range" min="0" max="120" value="24"></label><button id="apply" disabled>移除纯色背景</button><button id="restore" disabled>恢复原图</button><button id="export" disabled>导出 PNG</button></section>
<p id="status" role="status">请选择一张四角背景颜色一致的图片。支持最大 1600 万像素、32 MiB 文件。</p><section class="previews"><article><h2>原图</h2><div class="checker"><canvas id="original" aria-label="原图预览"></canvas><span class="empty">等待图片</span></div></article><article><h2>处理结果</h2><div class="checker"><canvas id="processed" aria-label="处理后透明背景预览"></canvas><span class="empty">应用处理后在此预览</span></div></article></section><footer>本地纯色抠图 · 不包含 AI 生成或云端上传</footer></main><script type="module" src="./workbench.js"></script><script type="module" src="./generation.js"></script></body></html>
